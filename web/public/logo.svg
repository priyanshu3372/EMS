<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" fill="none">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="40%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Outer hexagon (border) -->
  <path d="M50 5 L85 24 L85 76 L50 95 L15 76 L15 24 Z" fill="url(#hexGrad)" />

  <!-- Inner hexagon cutout (white fill to create border effect) -->
  <path d="M50 14 L78 30 L78 66 L50 82 L22 66 L22 30 Z" fill="white" />

  <!-- Map pin notch at bottom -->
  <path d="M42 88 L50 100 L58 88 Z" fill="url(#hexGrad)" />
  <path d="M44 86 L50 95 L56 86 Z" fill="white" />

  <!-- Inner gradient fill (slightly smaller than white cutout) -->
  <path d="M50 16 L76 31 L76 65 L50 80 L24 65 L24 31 Z" fill="url(#innerGrad)" opacity="0.15" />

  <!-- CMS text inside -->
  <text x="50" y="57" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="18" fill="#374151" letter-spacing="1">CMS</text>

  <!-- CareerMap Solutions text -->
  <text x="110" y="46" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="22" fill="#D1D5DB" letter-spacing="-0.5">CareerMap</text>
  <text x="110" y="72" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="22" fill="#D1D5DB" letter-spacing="-0.5">Solutions</text>
</svg>
